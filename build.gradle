/*
 * GoblinTown — root build.
 * Module rules live in docs/rules/02-coding.md (§10-Language-specific).
 * Dependency direction is compiler-enforced: `sim` has NO gdx dependency.
 *
 * Note: the java-library plugin is applied from this file for every module —
 * the `java { }` extension cannot be called inside subprojects{}, so target
 * compatibility is set via `options.release` on the compile tasks instead.
 */
ext {
    gdxVersion = '1.13.1'
    junitVersion = '5.10.2'
    assertjVersion = '3.26.0'
    jacksonVersion = '2.17.2'
}

allprojects {
    group = 'dev.goblintown'
    version = '0.1.0'
    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java-library'

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 17
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        testLogging {
            events 'failed', 'skipped'
        }
    }

    dependencies {
        testImplementation platform("org.junit:junit-bom:${junitVersion}")
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        testImplementation "org.assertj:assertj-core:${assertjVersion}"
    }
}

project(':sim') {
    // H5: data tables live under data/ at repo root. They are on the sim
    // TEST classpath so tests load the very same JSON the game ships with —
    // no copied fixtures that could drift.
    sourceSets.test.resources.srcDirs '../data'

    dependencies {
        implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
        // NOTE: intentionally NO libGDX dependency (architecture rule M1/M2,
        // H7, H11). Do not add engine dependencies to :sim.
    }
}

project(':core') {
    dependencies {
        api project(':sim')
        api "com.badlogicgames.gdx:gdx:$gdxVersion"
        // headless boot smoke test (rules/03 cat. 6): boot the fixture
        // without a window; natives for Pixmap/Texture loading
        testImplementation "com.badlogicgames.gdx:gdx-backend-headless:$gdxVersion"
        testRuntimeOnly "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
    }
}

project(':headless') {
    apply plugin: 'application'
    application {
        mainClass = 'dev.goblintown.gfx.HeadlessLauncher'
    }
    // same data-classpath trick as :sim — CLI tests exercise the real tables
    sourceSets.test.resources.srcDirs '../data'
    dependencies {
        implementation project(':sim')
        implementation "com.badlogicgames.gdx:gdx-backend-headless:$gdxVersion"
    }
}

project(':lwjgl3') {
    apply plugin: 'application'
    application {
        mainClass = 'dev.goblintown.gfx.DesktopLauncher'
    }
    dependencies {
        implementation project(':core')
        implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
        runtimeOnly "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
    }
}
